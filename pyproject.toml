[project]
name = "pianissimo-transcriber"
version = "0.1.0"
description = "Swedish speech-to-text: live microphone or audio files, ONNX or NeMo"
requires-python = ">=3.10"  # NeMo may need a narrower range; set it to what your NeMo version supports
dependencies = [
    "pyside6",
    "numpy",
    "scipy",
    "sounddevice",
    "soundfile",
    "onnx-asr",
    "onnxruntime",
    "huggingface-hub",
]

# PyTorch and NeMo are intentionally NOT listed here. They are optional and need a
# PyTorch build matched to the user's GPU driver, which `uv sync` can't detect.
# The app installs them on demand with `uv pip install --torch-backend=auto`.

[tool.uv]
package = false
